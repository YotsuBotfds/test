<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Progress - Survival Compendium</title>
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .progress-page-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .progress-page-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1.25rem;
            border-bottom: 2px solid var(--border);
        }

        .progress-page-header h1 {
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .progress-page-header p {
            color: var(--muted);
            font-size: 0.95rem;
        }

        .progress-overall {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--border-radius-xl);
            padding: 1.5rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .progress-overall-pct {
            font-size: 2.4rem;
            font-weight: 800;
            color: var(--accent);
        }

        .progress-overall-label {
            color: var(--muted);
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        .progress-overall-bar {
            height: 12px;
            background: var(--border);
            border-radius: 6px;
            margin-top: 1rem;
            overflow: hidden;
        }

        .progress-overall-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 6px;
            transition: width 0.5s ease;
        }

        .back-link {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.95em;
            display: inline-block;
            margin-bottom: 1rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* Reuse category-progress styles from main.css */
        .category-progress {
            background: transparent;
            border: none;
            padding: 0;
        }
    </style>
</head>
<body>
    <div class="progress-page-container">
        <a href="../index.html" class="back-link">← Back to Guides</a>

        <div class="progress-page-header">
            <h1>📈 Your Progress</h1>
            <p>Track your learning across all survival categories</p>
        </div>

        <div class="progress-overall" id="overall-progress">
            <div class="progress-overall-pct" id="overall-pct">0%</div>
            <div class="progress-overall-label"><span id="overall-read">0</span> of <span id="overall-total">0</span> guides completed</div>
            <div class="progress-overall-bar">
                <div class="progress-overall-fill" id="overall-fill" style="width: 0%"></div>
            </div>
        </div>

        <section id="next-up-section" style="margin-bottom:2rem;"></section>

        <section id="phase-progress" style="margin-bottom:2rem;"></section>

        <section id="review-section" style="margin-bottom:2rem;"></section>

        <section id="category-progress" class="category-progress"></section>
    </div>

    <script type="module">
        import * as storage from '../js/storage.js';

        const categoryColors = {
            'survival': '#ff6b6b',
            'medical': '#ff9999',
            'agriculture': '#53d8a8',
            'building': '#8b7355',
            'crafts': '#b19cd9',
            'communications': '#4a9eff',
            'defense': '#ff8c42',
            'sciences': '#7ec8e3',
            'chemistry': '#ffd700',
            'society': '#a78bfa',
            'tools': '#6ee7b7',
            'salvage': '#9ca3af',
            'reference': '#d4a574',
            'specialized': '#b19cd9',
            'metalworking': '#c084fc',
            'primitive-technology': '#92400e',
            'power-generation': '#fbbf24',
            'transportation': '#60a5fa',
            'resource-management': '#a78bfa',
            'culture-knowledge': '#d4a574',
            'biology': '#86efac',
            'utility': '#cbd5e1'
        };

        const categoryNames = {
            'survival': 'Immediate Survival',
            'medical': 'Medical & Health',
            'agriculture': 'Food & Agriculture',
            'building': 'Building & Engineering',
            'crafts': 'Crafts & Trade Skills',
            'communications': 'Communications',
            'defense': 'Security & Defense',
            'sciences': 'Foundational Sciences',
            'chemistry': 'Industrial Chemistry',
            'society': 'Society & Culture',
            'tools': 'Tools & Interactive',
            'salvage': 'Scavenging & Salvage',
            'reference': 'Master Reference',
            'specialized': 'Specialized',
            'metalworking': 'Metalworking',
            'primitive-technology': 'Primitive Technology',
            'power-generation': 'Power Generation',
            'transportation': 'Transportation',
            'resource-management': 'Resource Management',
            'culture-knowledge': 'Culture & Knowledge',
            'biology': 'Biology',
            'utility': 'Utilities'
        };

        const categoryIcons = {
            'survival': '🔥', 'medical': '🏥',
            'agriculture': '🌾', 'building': '🔨', 'crafts': '⚒️',
            'communications': '📡', 'defense': '🛡️', 'sciences': '🔬',
            'chemistry': '🏭', 'society': '🏛️', 'tools': '🛠️',
            'salvage': '♻️', 'reference': '📚', 'specialized': '🔧',
            'metalworking': '⚒️', 'primitive-technology': '🪨',
            'power-generation': '⚡', 'transportation': '🚗',
            'resource-management': '📦', 'culture-knowledge': '📖',
            'biology': '🧬', 'utility': '⚙️'
        };

        const categoryOrder = [
            'survival', 'medical', 'agriculture', 'building',
            'crafts', 'communications', 'defense', 'sciences', 'chemistry',
            'society', 'metalworking', 'power-generation', 'transportation',
            'resource-management', 'tools', 'salvage', 'reference', 'specialized'
        ];

        const milestoneMessages = {
            25: '🌱 Growing strong!',
            50: '⚡ Halfway there!',
            75: '🎯 Almost mastered!',
            100: '🏆 Category complete!'
        };

        function getMilestone(pct) {
            for (const m of [100, 75, 50, 25]) {
                if (pct >= m) return milestoneMessages[m];
            }
            return '';
        }

        async function render() {
            // Fetch all data in parallel
            const [guidesRes, prereqRes, orderRes] = await Promise.all([
                fetch('../data/guides.json'),
                fetch('../data/prerequisite-map.json'),
                fetch('../data/reading-order.json')
            ]);
            const guides = await guidesRes.json();
            const prereqMap = await prereqRes.json();
            const readingOrder = await orderRes.json();
            const progress = storage.getProgress();
            const completedSet = storage.getCompletedGuides();

            // Build file-to-id map
            const fileToId = {};
            for (const g of guides) {
                const filename = (g.file || g.url || '').split('/').pop();
                if (filename) fileToId[filename] = g.id;
            }

            // Calculate category stats
            const stats = {};
            let totalRead = 0, totalGuides = 0;

            for (const guide of guides) {
                const cat = guide.category || 'uncategorized';
                if (!stats[cat]) stats[cat] = { total: 0, read: 0 };
                stats[cat].total++;
                totalGuides++;
                if (progress[guide.id]?.completed) {
                    stats[cat].read++;
                    totalRead++;
                }
            }

            // Overall
            const overallPct = totalGuides > 0 ? Math.round((totalRead / totalGuides) * 100) : 0;
            document.getElementById('overall-pct').textContent = overallPct + '%';
            document.getElementById('overall-read').textContent = totalRead;
            document.getElementById('overall-total').textContent = totalGuides;
            document.getElementById('overall-fill').style.width = overallPct + '%';

            // === WHAT'S NEXT SECTION ===
            renderNextUp(guides, prereqMap, completedSet, progress, readingOrder, fileToId);

            // === PHASE PROGRESS SECTION ===
            renderPhaseProgress(readingOrder, completedSet, fileToId);

            // === REVIEW SECTION ===
            renderReviewSection(guides, progress);

            // === CATEGORIES ===
            const container = document.getElementById('category-progress');
            const ordered = [
                ...categoryOrder.filter(c => c in stats),
                ...Object.keys(stats).filter(c => !categoryOrder.includes(c) && c !== 'uncategorized').sort()
            ];

            for (const cat of ordered) {
                const s = stats[cat];
                const pct = s.total > 0 ? Math.round((s.read / s.total) * 100) : 0;
                const color = categoryColors[cat] || '#d4a574';
                const icon = categoryIcons[cat] || '📄';
                const name = categoryNames[cat] || cat;
                const milestone = getMilestone(pct);

                const item = document.createElement('div');
                item.className = 'progress-item';
                item.innerHTML = `
                    <div class="progress-header">
                        <span class="progress-category-name">
                            <span class="progress-icon">${icon}</span>
                            ${name}
                        </span>
                        <span class="progress-count">${s.read}/${s.total}</span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${pct}%; background-color: ${color};"></div>
                        </div>
                        <div class="progress-text">${pct}%</div>
                    </div>
                    ${milestone ? `<div class="progress-milestone">${milestone}</div>` : ''}
                `;
                container.appendChild(item);
            }

            // Apply theme
            const theme = localStorage.getItem('compendium-theme');
            if (theme) document.documentElement.setAttribute('data-theme', theme);
        }

        function renderNextUp(guides, prereqMap, completedSet, progress, readingOrder, fileToId) {
            const section = document.getElementById('next-up-section');
            if (!section) return;

            // Find guides with all prerequisites met but not yet read
            const candidates = guides.filter(g => {
                if (completedSet.has(g.id)) return false;
                if (g.prerequisites && g.prerequisites.length > 0) {
                    return g.prerequisites.every(pId => completedSet.has(pId));
                }
                return true;
            });

            // Score by: gateway impact, phase alignment, difficulty
            const phaseAlignments = readingOrder?.phaseAlignments || {};
            const currentPhase = (() => {
                for (const phase of (readingOrder?.phases || [])) {
                    const essentials = phase.tiers.essential;
                    const allDone = essentials.every(g => {
                        const id = fileToId[g.file];
                        return id && completedSet.has(id);
                    });
                    if (!allDone) return phase.number;
                }
                return 5;
            })();

            const scored = candidates.map(g => {
                const filename = (g.file || g.url || '').split('/').pop();
                const alignment = phaseAlignments[filename];
                let score = 0;
                if (alignment) {
                    score += (6 - Math.abs(alignment.phase - currentPhase)) * 100;
                    if (alignment.tier === 'essential') score += 30;
                    else if (alignment.tier === 'recommended') score += 20;
                }
                const unlocks = prereqMap.unlocks?.[g.id] || [];
                score += unlocks.length * 15;
                if (g.prerequisites && g.prerequisites.length > 0) score += 50;
                return { ...g, score, unlocksCount: unlocks.length, phase: alignment?.phase, tier: alignment?.tier };
            }).sort((a, b) => b.score - a.score).slice(0, 5);

            // Also find newly unlocked guides (prereqs completed in last 7 days)
            const newlyUnlocked = [];
            for (const [guideId, dep] of Object.entries(prereqMap.dependencies || {})) {
                if (completedSet.has(guideId)) continue;
                const allMet = dep.requires.every(r => completedSet.has(r));
                if (!allMet) continue;
                const recent = dep.requires.some(r => {
                    const p = progress[r];
                    if (!p?.lastUpdated) return false;
                    return (Date.now() - new Date(p.lastUpdated).getTime()) < 7 * 86400000;
                });
                if (recent) {
                    const guide = guides.find(g => g.id === guideId);
                    if (guide) newlyUnlocked.push(guide);
                }
            }

            let html = '<h2 style="color:var(--accent2);margin-bottom:1rem;">📍 What\'s Next</h2>';

            if (newlyUnlocked.length > 0) {
                html += '<div style="background:rgba(83,216,168,0.15);border:1px solid var(--accent2);border-radius:8px;padding:1rem;margin-bottom:1rem;">';
                html += '<div style="font-weight:700;color:var(--accent2);margin-bottom:0.5rem;">🔓 Recently Unlocked</div>';
                for (const g of newlyUnlocked.slice(0, 3)) {
                    html += `<a href="../${g.url}" style="display:block;padding:0.5rem;color:var(--text);text-decoration:none;border-radius:4px;" onmouseover="this.style.background='var(--card)'" onmouseout="this.style.background='transparent'">${g.icon || '📖'} <strong>${g.title}</strong> <span style="color:var(--muted);font-size:0.85rem;">— ${g.description?.slice(0, 60)}...</span></a>`;
                }
                html += '</div>';
            }

            if (scored.length > 0) {
                html += '<div style="display:grid;gap:0.75rem;">';
                for (const g of scored) {
                    const tierBadge = g.tier === 'essential' ? '<span style="background:var(--accent);color:var(--bg);padding:2px 8px;border-radius:12px;font-size:0.75rem;font-weight:600;">Essential</span>' :
                                      g.tier === 'recommended' ? '<span style="background:var(--accent2);color:var(--bg);padding:2px 8px;border-radius:12px;font-size:0.75rem;font-weight:600;">Recommended</span>' : '';
                    const unlocksBadge = g.unlocksCount > 0 ? `<span style="color:var(--accent2);font-size:0.85rem;">🔓 Unlocks ${g.unlocksCount}</span>` : '';
                    html += `
                    <a href="../${g.url}" style="display:flex;align-items:center;gap:1rem;padding:1rem;background:var(--card);border:1px solid var(--border);border-radius:8px;text-decoration:none;border-left:4px solid var(--accent2);transition:transform 0.2s;" onmouseover="this.style.transform='translateX(4px)'" onmouseout="this.style.transform='none'">
                        <span style="font-size:1.5rem;">${g.icon || '📖'}</span>
                        <div style="flex:1;">
                            <div style="color:var(--accent);font-weight:600;">${g.title}</div>
                            <div style="color:var(--muted);font-size:0.85rem;margin-top:2px;">${g.description?.slice(0, 80) || ''}${g.phase !== undefined ? ' · Phase ' + g.phase : ''}</div>
                        </div>
                        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">${tierBadge}${unlocksBadge}</div>
                    </a>`;
                }
                html += '</div>';
            } else {
                html += '<p style="color:var(--muted);">All recommended guides completed! Check supplementary materials.</p>';
            }

            section.innerHTML = html;
        }

        function renderPhaseProgress(readingOrder, completedSet, fileToId) {
            const section = document.getElementById('phase-progress');
            if (!section || !readingOrder?.phases) return;

            let html = '<h2 style="color:var(--accent);margin-bottom:1rem;">🗺️ Phase Progress</h2>';
            html += '<div style="display:grid;gap:0.75rem;">';

            for (const phase of readingOrder.phases) {
                let total = 0, done = 0;
                for (const tier of Object.values(phase.tiers)) {
                    for (const guide of tier) {
                        total++;
                        const id = fileToId[guide.file];
                        if (id && completedSet.has(id)) done++;
                    }
                }
                const pct = total > 0 ? Math.round((done / total) * 100) : 0;
                const isComplete = pct === 100;

                html += `
                <div style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:1rem;${isComplete ? 'border-color:var(--accent2);' : ''}">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
                        <div>
                            <span style="font-weight:700;color:var(--accent);font-size:1.1rem;">Phase ${phase.number}</span>
                            <span style="color:var(--text);margin-left:0.5rem;">${phase.name}</span>
                            <span style="color:var(--muted);font-size:0.85rem;margin-left:0.5rem;">${phase.timeframe}</span>
                        </div>
                        <div style="font-weight:700;color:${isComplete ? 'var(--accent2)' : 'var(--muted)'};">${pct}%</div>
                    </div>
                    <div style="height:8px;background:var(--border);border-radius:4px;overflow:hidden;">
                        <div style="height:100%;background:${isComplete ? 'var(--accent2)' : 'var(--accent)'};width:${pct}%;border-radius:4px;transition:width 0.5s;"></div>
                    </div>
                    <div style="color:var(--muted);font-size:0.8rem;margin-top:0.5rem;">${done}/${total} guides · ${isComplete ? '✅ Complete!' : phase.goal.slice(0, 80) + '...'}</div>
                </div>`;
            }
            html += '</div>';
            section.innerHTML = html;
        }

        function renderReviewSection(guides, progress) {
            const section = document.getElementById('review-section');
            if (!section) return;

            const now = Date.now();
            const needsReview = [];

            for (const [guideId, data] of Object.entries(progress)) {
                if (!data.completed || !data.lastUpdated) continue;
                const days = (now - new Date(data.lastUpdated).getTime()) / 86400000;
                if (days >= 30) {
                    const guide = guides.find(g => g.id === guideId);
                    if (guide) needsReview.push({ ...guide, daysSince: Math.round(days) });
                }
            }

            if (needsReview.length === 0) return;

            needsReview.sort((a, b) => b.daysSince - a.daysSince);
            const toShow = needsReview.slice(0, 5);

            let html = '<h2 style="color:#fbbf24;margin-bottom:1rem;">🔄 Time to Review</h2>';
            html += '<p style="color:var(--muted);font-size:0.9rem;margin-bottom:1rem;">These guides were completed over 30 days ago. A quick refresher can help retain key knowledge.</p>';
            html += '<div style="display:grid;gap:0.5rem;">';
            for (const g of toShow) {
                html += `
                <a href="../${g.url}" style="display:flex;align-items:center;gap:1rem;padding:0.75rem 1rem;background:var(--card);border:1px solid var(--border);border-radius:6px;text-decoration:none;border-left:3px solid #fbbf24;">
                    <span>${g.icon || '📖'}</span>
                    <div style="flex:1;">
                        <div style="color:var(--text);font-weight:500;">${g.title}</div>
                        <div style="color:var(--muted);font-size:0.8rem;">Read ${g.daysSince} days ago</div>
                    </div>
                    <span style="color:#fbbf24;font-size:0.85rem;">Review →</span>
                </a>`;
            }
            html += '</div>';
            if (needsReview.length > 5) {
                html += `<p style="color:var(--muted);font-size:0.85rem;margin-top:0.5rem;">+${needsReview.length - 5} more guides could use a review</p>`;
            }
            section.innerHTML = html;
        }

        render();
    </script>
</body>
</html>
