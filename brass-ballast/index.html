<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Brass &amp; Ballast</title>
  <meta name="description" content="A steampunk skyship twin-stick shooter. Captain a brass-and-canvas airship against the Iron Syndicate's armada.">
  <meta name="theme-color" content="#2b1d10">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Brass&amp;Ballast">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game" aria-label="Game view"></canvas>
  <div id="ui"></div>
  <div id="boot" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100">
    <div class="boot-steam" aria-hidden="true"><i></i><i></i><i></i></div>
    <svg class="boot-gauge" viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <linearGradient id="bg-brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1c2"/><stop offset=".3" stop-color="#e3b860"/><stop offset=".6" stop-color="#a87a30"/><stop offset="1" stop-color="#4a3112"/></linearGradient>
        <radialGradient id="bg-face" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#fbf3dc"/><stop offset=".8" stop-color="#e6d3a6"/><stop offset="1" stop-color="#b89b66"/></radialGradient>
        <radialGradient id="bg-glass" cx=".35" cy=".25" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      </defs>
      <circle cx="100" cy="100" r="97" fill="url(#bg-brass)" stroke="#1a120a" stroke-width="3"/>
      <circle cx="100" cy="100" r="84" fill="#2b1d10"/>
      <circle cx="100" cy="100" r="80" fill="url(#bg-face)"/>
      <g fill="#fbe7a9" stroke="#3a2610" stroke-width="1"><circle cx="190" cy="100" r="2.6"/><circle cx="177.9" cy="145" r="2.6"/><circle cx="145" cy="177.9" r="2.6"/><circle cx="100" cy="190" r="2.6"/><circle cx="55" cy="177.9" r="2.6"/><circle cx="22.1" cy="145" r="2.6"/><circle cx="10" cy="100" r="2.6"/><circle cx="22.1" cy="55" r="2.6"/><circle cx="55" cy="22.1" r="2.6"/><circle cx="100" cy="10" r="2.6"/><circle cx="145" cy="22.1" r="2.6"/><circle cx="177.9" cy="55" r="2.6"/></g>
      <path d="M166.6 78.4A70 70 0 0 1 160.6 135" fill="none" stroke="#8c2f2b" stroke-width="8" opacity=".85"/>
      <path d="M39.4 135A70 70 0 0 1 166.6 78.4" fill="none" stroke="#c9973f" stroke-width="2" opacity=".6"/>
      <g stroke="#2b1d10" stroke-width="1.6" stroke-linecap="round"><line x1="46.3" y1="131" x2="35.9" y2="137" stroke-width="3"/><line x1="37" y1="122.9" x2="30.5" y2="125.3"/><line x1="34" y1="111.6" x2="27.1" y2="112.8"/><line x1="33" y1="100" x2="26" y2="100"/><line x1="38.9" y1="89.2" x2="27.1" y2="87.2" stroke-width="3"/><line x1="37" y1="77.1" x2="30.5" y2="74.7"/><line x1="42" y1="66.5" x2="35.9" y2="63"/><line x1="48.7" y1="56.9" x2="43.3" y2="52.4"/><line x1="60.1" y1="52.5" x2="52.4" y2="43.3" stroke-width="3"/><line x1="66.5" y1="42" x2="63" y2="35.9"/><line x1="77.1" y1="37" x2="74.7" y2="30.5"/><line x1="88.4" y1="34" x2="87.2" y2="27.1"/><line x1="100" y1="38" x2="100" y2="26" stroke-width="3"/><line x1="111.6" y1="34" x2="112.8" y2="27.1"/><line x1="122.9" y1="37" x2="125.3" y2="30.5"/><line x1="133.5" y1="42" x2="137" y2="35.9"/><line x1="139.9" y1="52.5" x2="147.6" y2="43.3" stroke-width="3"/><line x1="151.3" y1="56.9" x2="156.7" y2="52.4"/><line x1="158" y1="66.5" x2="164.1" y2="63"/><line x1="163" y1="77.1" x2="169.5" y2="74.7"/><line x1="161.1" y1="89.2" x2="172.9" y2="87.2" stroke-width="3"/><line x1="167" y1="100" x2="174" y2="100"/><line x1="166" y1="111.6" x2="172.9" y2="112.8"/><line x1="163" y1="122.9" x2="169.5" y2="125.3"/><line x1="153.7" y1="131" x2="164.1" y2="137" stroke-width="3"/></g>
      <g font-family="Georgia, serif" font-size="11" fill="#3a2610" text-anchor="middle"><text x="56.7" y="129">0</text><text x="50.8" y="95.3">20</text><text x="67.9" y="65.7">40</text><text x="100" y="54">60</text><text x="132.1" y="65.7">80</text><text x="149.2" y="95.3">100</text><text x="143.3" y="129">120</text></g>
      <text x="100" y="138" text-anchor="middle" font-family="Georgia, serif" font-size="9" letter-spacing="2" fill="#6e4723">PRESSURE</text>
      <g class="boot-needle"><g class="boot-needle-wob">
        <path d="M100 100 L96 104 L100 34 L104 104 Z" fill="#8c2f2b" stroke="#2b1208" stroke-width="1.2"/>
        <path d="M100 100 L98 118 L102 118 Z" fill="#2b1d10"/>
      </g></g>
      <circle cx="100" cy="100" r="8" fill="url(#bg-brass)" stroke="#1a120a" stroke-width="2"/>
      <circle cx="100" cy="100" r="80" fill="url(#bg-glass)"/>
    </svg>
    <div class="boot-title">Brass <span>&amp;</span> Ballast</div>
    <div class="boot-track"><div id="boot-bar"></div></div>
    <div class="boot-label">Stoking the boilers…</div>
    <noscript><p class="boot-noscript">Brass &amp; Ballast needs JavaScript to raise steam.</p></noscript>
  </div>
  <script>
    // Drive the boot gauge needle from #boot-bar's width (set by the loader in main.js).
    (function () {
      var boot = document.getElementById('boot');
      var bar = document.getElementById('boot-bar');
      if (!boot || !bar || !window.MutationObserver) return;
      var labels = ['Stoking the boilers…', 'Riveting the hull…', 'Stitching the envelope…', 'Polishing the brass…', 'Loading the cannons…', 'Casting off!'];
      var label = boot.querySelector('.boot-label');
      new MutationObserver(function () {
        var p = Math.max(0, Math.min(1, (parseFloat(bar.style.width) || 0) / 100));
        boot.style.setProperty('--p', p.toFixed(3));
        boot.setAttribute('aria-valuenow', String(Math.round(p * 100)));
        if (label) label.textContent = labels[Math.min(labels.length - 1, Math.floor(p * (labels.length - 1) + 0.0001))];
      }).observe(bar, { attributes: true, attributeFilter: ['style'] });
    })();
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
