<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FX Preview — Brass &amp; Ballast</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1b130b; overflow: hidden; }
    body { font: 12px Georgia, serif; color: #f1e3c0; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 6px 8px; display: flex; flex-wrap: wrap;
      gap: 4px; background: rgba(27,19,11,.72); border-top: 1px solid rgba(242,212,138,.35); }
    #ui button { font: 11px Georgia, serif; color: #2b1d10; background: linear-gradient(#f2d48a, #c9973f);
      border: 1px solid #4a3112; border-radius: 3px; padding: 2px 6px; cursor: pointer; }
    #ui button:hover { filter: brightness(1.12); }
    #hud { position: fixed; top: 8px; right: 10px; text-align: right; font: 12px "Courier New", monospace;
      text-shadow: 0 1px 2px #000; white-space: pre; }
    #ui.hidden { display: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud"></div>
  <div id="ui"></div>
  <script type="module" src="./fx.js"></script>
</body>
</html>
