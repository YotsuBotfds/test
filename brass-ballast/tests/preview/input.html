<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Input Preview — Brass &amp; Ballast</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b130b; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #readout {
      position: fixed; top: 8px; right: 8px; z-index: 2; pointer-events: none; margin: 0;
      font: 11px/1.35 "Courier New", monospace; color: #f1e3c0; white-space: pre;
      background: rgba(27, 19, 11, 0.78); border: 1px solid rgba(242, 212, 138, 0.4);
      padding: 6px 8px; border-radius: 4px; max-width: 46vw; overflow: hidden;
    }
    @media (max-width: 900px) { #readout { font-size: 8px; top: auto; bottom: 4px; right: 50%; transform: translateX(50%); opacity: 0.85; } }
    .noreadout #readout { display: none; }
    #title {
      position: fixed; left: 70px; top: 14px; z-index: 2; pointer-events: none;
      font: bold 14px Georgia, serif; color: #f2d48a; text-shadow: 0 1px 2px #000;
    }
    #title small { display: block; font: 11px Georgia, serif; color: #d9c49a; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="title">WP2 · Input preview
    <small>WASD move · arrows/mouse aim · LMB/arrows fire · Space boost · E/Q/RMB bomb · Esc/P pause · G toggle gameplay · H left-handed</small>
  </div>
  <pre id="readout"></pre>
  <script type="module" src="./input.js"></script>
</body>
</html>
