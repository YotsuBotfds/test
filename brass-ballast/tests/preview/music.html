<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Hall — Brass &amp; Ballast</title>
  <style>
    :root { --ink: #f1e3c0; --brass: #f2d48a; --brass2: #c9973f; --dark: #1b130b; --panel: #2b1d10;
      --line: rgba(242,212,138,.28); --bad: #e0573a; --good: #9fd36b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--dark); color: var(--ink); }
    body { font: 13px Georgia, serif; padding: 12px 16px 40px; max-width: 1280px; }
    h1 { font-size: 22px; margin: 0 0 2px; color: var(--brass); letter-spacing: .05em; }
    h2 { font-size: 12px; margin: 14px 0 6px; color: var(--brass); text-transform: uppercase;
      letter-spacing: .14em; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
    .sub { opacity: .7; margin-bottom: 8px; }
    a { color: var(--brass); }
    #tracks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
    .trk { text-align: left; font: 13px Georgia, serif; color: #2b1d10; cursor: pointer; padding: 6px 8px;
      background: linear-gradient(#f2d48a, #c9973f); border: 1px solid #4a3112; border-radius: 4px; }
    .trk small { display: block; font-size: 10.5px; opacity: .75; margin-top: 1px; }
    .trk:hover { filter: brightness(1.1); }
    .trk.on { background: linear-gradient(#bfe58f, #6f9d3e); }
    .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: 8px; }
    button.small { font: 12px Georgia, serif; color: #2b1d10; background: linear-gradient(#f2d48a, #c9973f);
      border: 1px solid #4a3112; border-radius: 3px; padding: 4px 9px; cursor: pointer; }
    button.small.on { background: linear-gradient(#bfe58f, #6f9d3e); }
    label { display: inline-flex; align-items: center; gap: 6px; }
    input[type=range] { width: 180px; accent-color: var(--brass2); }
    #status { font: 12px "Courier New", monospace; white-space: pre; margin-top: 6px; opacity: .9; }
    #meters { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
    .meter { width: 112px; }
    .meter .bar { height: 8px; background: #120c06; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
    .meter .fill { height: 100%; width: 0; background: linear-gradient(90deg, #c9973f, #f2d48a); }
    .meter .lbl { font-size: 11px; opacity: .8; }
    canvas { background: #120c06; border: 1px solid var(--line); border-radius: 4px; display: block; width: 100%; }
    #roll { height: 260px; }
    #scope { height: 70px; margin-top: 6px; }
    #check { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px; }
    .cell { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 5px; }
    .cell.bad { border-color: var(--bad); }
    .cell .n { font-weight: bold; color: var(--brass); }
    .cell .m { font: 11px "Courier New", monospace; opacity: .85; }
    .cell canvas { height: 40px; margin-top: 3px; }
    #summary { font: 14px "Courier New", monospace; margin: 8px 0; }
    #summary.ok { color: var(--good); } #summary.fail { color: var(--bad); }
    #legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px; margin-top: 4px; opacity: .85; }
    #legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 3px; vertical-align: -1px; }
  </style>
</head>
<body>
  <h1>Brass &amp; Ballast — Music Hall</h1>
  <div class="sub">WP8 generative score. Pick a track (click unlocks audio), ride the intensity lever,
    watch the piano roll. <a href="?check=1">Run offline check</a> ·
    <a href="?check=mix&amp;track=brassbay">Channel balance (brassbay)</a></div>
  <div id="app"></div>
  <script type="module" src="./music.js"></script>
</body>
</html>
