const hud = {
  root: document.getElementById('hud'),
  brand: document.getElementById('brand'),
  sog: document.getElementById('sog'),
  hdg: document.getElementById('hdg'),
  tws: document.getElementById('tws'),
  cam: document.getElementById('cam'),
  hint: document.getElementById('hint'),
  last: 0,
  hintTimer: 0,
};
function showHint(text) {
  hud.hint.textContent = text;
  hud.hint.classList.add('is-on');
  clearTimeout(hud.hintTimer);
  hud.hintTimer = setTimeout(() => hud.hint.classList.remove('is-on'), 1800);
}
function updateHud(state, now) {
  if (now - hud.last < 120) return;
  hud.last = now;
  hud.sog.innerHTML = `${(state.v * 0.86).toFixed(1)}<small>kn</small>`;
  hud.hdg.textContent = `${String(Math.round((270 - THREE.MathUtils.radToDeg(state.yaw) + 360) % 360)).padStart(3, '0')}°`;
  hud.tws.innerHTML = `${(18 + 2.5 * Math.sin(state.tl * W * 3)).toFixed(0)}<small>kn</small>`;
  hud.cam.textContent = state.shotName;
}

function frame(now) {
  const dt = Math.min(0.1, (now - clock.last) / 1000);
  clock.last = now;
  if (clock.playing) {
    if (audio.on && audio.ctx && audio.ctx.state === 'running') {
      clock.t = audio.anchorT + (audio.ctx.currentTime - audio.anchorCtx) - (audio.ctx.outputLatency || 0);
    } else {
      clock.t += dt;
    }
  }
  const state = update(clock.t);
  composer.render(dt);
  updateHud(state, now);
  adaptQuality(dt);
  requestAnimationFrame(frame);
}

function setupUi() {
  const btnSound = document.getElementById('btn-sound');
  const btnCam = document.getElementById('btn-cam');
  const btnPause = document.getElementById('btn-pause');
  const btnFull = document.getElementById('btn-full');
  const btnHud = document.getElementById('btn-hud');
  const setPause = (paused) => {
    clock.playing = !paused;
    btnPause.setAttribute('aria-pressed', String(paused));
    btnPause.firstChild.textContent = paused ? 'Play' : 'Pause';
    if (audio.ctx) { if (paused) audio.ctx.suspend(); else if (audio.on) audio.ctx.resume(); }
  };
  const toggleSound = async () => {
    if (audio.on) { stopAudio(); btnSound.setAttribute('aria-pressed', 'false'); showHint('Sound off'); return; }
    try {
      if (!clock.playing) setPause(false);
      await startAudio();
      btnSound.setAttribute('aria-pressed', 'true');
      showHint('Sound on');
    } catch (err) {
      showHint('Audio is blocked in this browser');
    }
  };
  const cycleCam = () => {
    mode = MODES[(MODES.indexOf(mode) + 1) % MODES.length];
    btnCam.firstChild.textContent = `Camera: ${mode}`;
    if (mode === 'Free') {
      if (!controls) {
        controls = new OrbitControls(camera, canvas);
        controls.enableDamping = true;
        controls.minDistance = 8;
        controls.maxDistance = 140;
        controls.maxPolarAngle = Math.PI * 0.49;
      }
      controls.enabled = true;
      camera.position.set(lastBoat.x + 18, 9, 24);
      showHint('Drag to orbit, scroll to zoom');
    } else {
      if (controls) controls.enabled = false;
      showHint(mode === 'Auto' ? 'Cinematic camera' : `${mode} camera`);
    }
  };
  const toggleFull = async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch (err) {
      showHint('Fullscreen is not available here');
    }
  };
  const toggleHud = () => {
    const hidden = hud.root.classList.toggle('is-hidden');
    btnHud.firstChild.textContent = hidden ? 'Show HUD' : 'Hide HUD';
    if (hidden) showHint('Press H or tap to bring the HUD back');
  };
  btnSound.addEventListener('click', toggleSound);
  btnCam.addEventListener('click', cycleCam);
  btnPause.addEventListener('click', () => setPause(clock.playing));
  btnFull.addEventListener('click', toggleFull);
  btnHud.addEventListener('click', toggleHud);
  canvas.addEventListener('click', () => { if (hud.root.classList.contains('is-hidden') && mode !== 'Free') toggleHud(); });
  window.addEventListener('keydown', (e) => {
    if (e.target instanceof HTMLButtonElement && (e.key === ' ' || e.key === 'Enter')) return;
    const k = e.key.toLowerCase();
    if (k === ' ') { e.preventDefault(); setPause(clock.playing); }
    else if (k === 'm') toggleSound();
    else if (k === 'c') cycleCam();
    else if (k === 'f') toggleFull();
    else if (k === 'h') toggleHud();
  });
  document.addEventListener('visibilitychange', () => {
    if (!audio.ctx || !audio.on) return;
    if (document.hidden) audio.ctx.suspend(); else if (clock.playing) audio.ctx.resume();
  });
  window.addEventListener('resize', resize);
  if (REDUCED) { setPause(true); showHint('Paused for reduced motion. Press Play to sail.'); }
  setTimeout(() => hud.brand.classList.add('is-quiet'), 7000);
}

// ============================================================================
// Boot
// ============================================================================
if (RENDER) {
  window.__ready = init().then(() => {
    update(0);
    composer.render(0);
    return { loop: LOOP, w: RENDER_W, h: RENDER_H };
  });
  window.__frame = (t, opts = {}) => {
    const sub = Math.max(1, opts.subframes || 1);
    if (sub === 1) { update(t, opts); composer.render(1 / 60); return; }
    // motion blur: average subframes across the shutter into an accumulation target
    accumulate(t, opts, sub);
  };
  window.__soundtrack = (seconds, fade) => renderSoundtrack(seconds, fade);
} else {
  init().catch((err) => {
    document.querySelector('#loader p').textContent = 'The scene failed to load. Reload to try again.';
    throw err;
  }).then(() => {
    setupUi();
    update(0);
    composer.render(0);
    document.getElementById('loader').classList.add('is-done');
    clock.last = performance.now();
    requestAnimationFrame(frame);
  });
}

let accum = null;
function accumulate(t, opts, sub) {
  if (!accum) {
    const w = renderer.domElement.width, h = renderer.domElement.height;
    const m = new THREE.ShaderMaterial({
      uniforms: { tex: { value: null }, k: { value: 1 } },
      vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
      fragmentShader: 'uniform sampler2D tex; uniform float k; varying vec2 vUv; void main() { gl_FragColor = vec4(texture2D(tex, vUv).rgb * k, 1.0); }',
      depthTest: false,
      depthWrite: false,
    });
    accum = {
      sum: new THREE.WebGLRenderTarget(w, h, { type: THREE.HalfFloatType }),
      quad: new THREE.Mesh(new THREE.PlaneGeometry(2, 2), m),
      scene: new THREE.Scene(),
      cam: new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1),
    };
    accum.quad.frustumCulled = false;
    accum.scene.add(accum.quad);
  }
  const shutter = opts.shutter ?? 0.5 / 30;
  const m = accum.quad.material;
  composer.renderToScreen = false;
  for (let i = 0; i < sub; i++) {
    update(t + ((i + 0.5) / sub - 0.5) * shutter, opts);
    composer.render(1 / 60);
    m.uniforms.tex.value = composer.readBuffer.texture;
    m.uniforms.k.value = 1 / sub;
    m.blending = i === 0 ? THREE.NoBlending : THREE.AdditiveBlending;
    renderer.setRenderTarget(accum.sum);
    renderer.autoClear = i === 0;
    renderer.render(accum.scene, accum.cam);
  }
  composer.renderToScreen = true;
  renderer.autoClear = true;
  renderer.setRenderTarget(null);
  m.uniforms.tex.value = accum.sum.texture;
  m.uniforms.k.value = 1;
  m.blending = THREE.NoBlending;
  renderer.render(accum.scene, accum.cam);
}
</script>
